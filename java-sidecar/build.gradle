plugins {
    id 'java'
    id 'application'
}

group = 'com.umlanalyze'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'com.umlanalyze.javasidecar.Main'
}
